<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="options.css">
  <title>Bastion - Settings</title>
</head>
<body>
  <div class="container">
    <header>
      <h1>Bastion</h1>
      <p class="subtitle">Site Controls</p>
    </header>

    <div class="portability-toolbar">
      <div class="portability-actions">
        <button id="export-file" class="btn-toolbar" title="Download config as JSON file">Export File</button>
        <button id="export-string" class="btn-toolbar" title="Copy config as encoded string">Export String</button>
        <button id="import-file" class="btn-toolbar" title="Import config from JSON file">Import File</button>
        <button id="import-string" class="btn-toolbar" title="Import config from encoded string">Import String</button>
      </div>
      <div id="portability-status" class="portability-status"></div>
    </div>

    <input type="file" id="import-file-input" accept=".json" style="display:none" />

    <div id="sites-list"></div>

    <button id="add-site" class="btn-primary">+ Add Site</button>

    <template id="site-card-template">
      <div class="site-card">
        <div class="site-header">
          <input type="text" class="domain-input" placeholder="reddit.com" />
          <label class="toggle">
            <input type="checkbox" class="site-enabled" checked />
            <span class="toggle-slider"></span>
          </label>
          <button class="btn-icon btn-delete-site" title="Delete site">&times;</button>
        </div>
        <div class="controls-list"></div>
        <button class="btn-secondary btn-add-control">+ Add Control</button>
      </div>
    </template>

    <template id="control-card-template">
      <div class="control-card">
        <div class="control-header">
          <select class="control-type">
            <option value="time-limit">Time Limit</option>
            <option value="nav-frequency">Nav Frequency</option>
            <option value="degradation">Degradation</option>
            <option value="speed-bump">Speed Bump</option>
          </select>
          <label class="toggle">
            <input type="checkbox" class="control-enabled" checked />
            <span class="toggle-slider"></span>
          </label>
          <button class="btn-icon btn-delete-control" title="Remove control">&times;</button>
        </div>
        <div class="control-fields"></div>
        <div class="bypass-section">
          <label class="toggle bypass-toggle">
            <input type="checkbox" class="bypass-enabled" />
            <span class="toggle-slider"></span>
            <span>Bypass Policy</span>
          </label>
          <div class="bypass-config" style="display:none"></div>
        </div>
      </div>
    </template>
    <template id="modal-template">
      <div class="modal-backdrop">
        <div class="modal">
          <p class="modal-message"></p>
          <div class="modal-body"></div>
          <div class="modal-actions"></div>
        </div>
      </div>
    </template>
  </div>
  <script src="options.js" type="module"></script>
</body>
</html>
